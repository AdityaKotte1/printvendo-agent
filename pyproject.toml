[project]
name = "printvendo-agent"
version = "1.7.4"
description = "The Printvendo device agent: one agent, Raspberry Pi and Windows."
requires-python = ">=3.11"
dependencies = [
    # The only runtime dependency. Everything else is the standard library,
    # deliberately: this runs unattended on a Pi at a shop, and every package
    # is something that can fail to install there.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Windows only, and only for listing printers by name. Printing itself goes
# through Ghostscript, which needs nothing from Python.
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
printvendo-agent = "agent.__main__:main"
# The shop screen's lock. A console-script entry point *is* the .exe the
# operator runs -- `venv\Scripts\printvendo-display.exe` -- so there is no
# PyInstaller step, no second build, and no frozen copy of the agent that can
# drift from the installed one.
printvendo-display = "display.guard:main"
# Why the keyboard hook was refused, in Windows' own words. A diagnostic:
# SetWindowsHookExW returning NULL says nothing on its own.
printvendo-display-hookcheck = "display.hookcheck:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "display*"]

[tool.setuptools.package-data]
# The page the shop screen shows, and its display face. Data rather than code,
# and it has to travel with the install: the server resolves it relative to the
# package, so a wheel without it serves a 404 above a counter.
display = ["page/*.html", "page/*.css", "page/*.js", "page/*.woff2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
